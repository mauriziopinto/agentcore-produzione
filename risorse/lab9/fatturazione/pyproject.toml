[build-system]
requires = ["hatchling ~= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fatturazione"
version = "0.1.0"
description = "Lab 9: lo specialista fatturazione di TelcoCare, esposto con il protocollo A2A"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[all] ~= 0.3.26",
    "aws-opentelemetry-distro ~= 0.21.0",
    "bedrock-agentcore[a2a,strands-agents] >= 1.24.0, < 2.0.0",
    "botocore[crt] ~= 1.43.0",
    "strands-agents >= 1.62.0, < 2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
